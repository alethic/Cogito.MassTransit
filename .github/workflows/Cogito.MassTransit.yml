name: Cogito.MassTransit

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this build to nuget.org, creating the GitHub release if one does not exist.
        type: boolean
        default: false
  push:
    branches:
    - main
    - develop
  pull_request:
    branches:
    - main
    - develop
  release:
    types:
    - created

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
    - name: Checkout Source
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Setup .NET 8.0
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.0.x
    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v4
      with:
        versionSpec: 6.x
    - name: Execute GitVersion
      uses: gittools/actions/gitversion/execute@v4
      with:
        useConfigFile: true
    - name: Add NuGet Source (GitHub)
      shell: pwsh
      run: dotnet nuget add source $env:GITHUB_REPOS --name ${{ github.repository_owner }} --username USERNAME --password $env:GITHUB_TOKEN --store-password-in-clear-text
      env:
        GITHUB_REPOS: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: NuGet Restore
      run: dotnet restore Cogito.MassTransit.slnx
    - name: Build
      shell: pwsh
      run: |
        dotnet msbuild /m /bl `
          /p:Configuration="Release" `
          /p:Platform="Any CPU" `
          /p:Version=${env:GitVersion_FullSemVer} `
          /p:AssemblyVersion=${env:GitVersion_AssemblySemVer} `
          /p:InformationalVersion=${env:GitVersion_InformationalVersion} `
          /p:FileVersion=${env:GitVersion_AssemblySemFileVer} `
          /p:PackageVersion=${env:GitVersion_FullSemVer} `
          /p:RepositoryUrl="${env:GITHUB_SERVER_URL}/${env:GITHUB_REPOSITORY}.git" `
          /p:PackageProjectUrl="${env:GITHUB_SERVER_URL}/${env:GITHUB_REPOSITORY}" `
          /p:BuildInParallel=true `
          /p:ContinuousIntegrationBuild=true `
          Cogito.MassTransit.dist.msbuildproj
    - name: Upload MSBuild Log
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: msbuild.binlog
        path: msbuild.binlog
    - name: Upload NuGet Packages
      uses: actions/upload-artifact@v7
      with:
        name: nuget
        path: dist/nuget
    - name: Package Tests
      run: tar czvf tests.tar.gz tests
      working-directory: dist
    - name: Upload Tests
      uses: actions/upload-artifact@v7
      with:
        name: tests
        path: dist/tests.tar.gz
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
        - { run: Cogito.MassTransit.Tests, tfm: net10.0, sys: win-x64 }
        - { run: Cogito.MassTransit.Tests, tfm: net10.0, sys: linux-x64 }
        - { run: Cogito.MassTransit.Tests, tfm: net10.0, sys: osx-arm64 }
        - { run: Cogito.MassTransit.Tests, tfm: net8.0, sys: win-x64 }
        - { run: Cogito.MassTransit.Tests, tfm: net8.0, sys: linux-x64 }
        - { run: Cogito.MassTransit.Tests, tfm: net8.0, sys: osx-arm64 }
        - { run: Cogito.MassTransit.Tests, tfm: net481, sys: win-x64 }
        - { run: Cogito.MassTransit.DependencyInjection.Tests, tfm: net10.0, sys: win-x64 }
        - { run: Cogito.MassTransit.DependencyInjection.Tests, tfm: net10.0, sys: linux-x64 }
        - { run: Cogito.MassTransit.DependencyInjection.Tests, tfm: net10.0, sys: osx-arm64 }
        - { run: Cogito.MassTransit.DependencyInjection.Tests, tfm: net8.0, sys: win-x64 }
        - { run: Cogito.MassTransit.DependencyInjection.Tests, tfm: net8.0, sys: linux-x64 }
        - { run: Cogito.MassTransit.DependencyInjection.Tests, tfm: net8.0, sys: osx-arm64 }
        - { run: Cogito.MassTransit.DependencyInjection.Tests, tfm: net481, sys: win-x64 }
        - { run: Cogito.MassTransit.EntityFrameworkCore.DependencyInjection.Tests, tfm: net10.0, sys: win-x64 }
        - { run: Cogito.MassTransit.EntityFrameworkCore.DependencyInjection.Tests, tfm: net10.0, sys: linux-x64 }
        - { run: Cogito.MassTransit.EntityFrameworkCore.DependencyInjection.Tests, tfm: net10.0, sys: osx-arm64 }
        - { run: Cogito.MassTransit.EntityFrameworkCore.DependencyInjection.Tests, tfm: net8.0, sys: win-x64 }
        - { run: Cogito.MassTransit.EntityFrameworkCore.DependencyInjection.Tests, tfm: net8.0, sys: linux-x64 }
        - { run: Cogito.MassTransit.EntityFrameworkCore.DependencyInjection.Tests, tfm: net8.0, sys: osx-arm64 }
    name: Test (${{ matrix.run }}:${{ matrix.tfm }}:${{ matrix.sys }})
    needs:
    - build
    runs-on: ${{ fromJSON('{"win-x64":["windows-2022"],"linux-x64":["ubuntu-24.04"],"osx-arm64":["macos-15"]}')[matrix.sys] }}
    steps:
    - name: Setup .NET 8.0
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.0.x
    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Download Tests
      uses: actions/download-artifact@v8
      with:
        name: tests
    - name: Restore Tests
      run: tar xzvf tests.tar.gz
    - name: Execute Tests
      timeout-minutes: 120
      shell: pwsh
      run: |
        # assign powershell variables
        $run = "${{ matrix.run }}"
        $tfm = "${{ matrix.tfm }}"
        $sys = "${{ matrix.sys }}"

        # suite name can contain filter expression after ?
        $split = $run.IndexOf("?")
        if ($split -gt -1) {
            $tst = $run.Substring(0, $split)
            $qry = $run.Substring($split + 1)
        } else {
            $tst = $run
        }

        # scan and process test assemblies
        $tests = $(gi .\tests\$tst\$tfm\*.Tests.dll)
        if ($tests) {
            $argl = @(
                "-f", $tfm,
                "-v:diag",
                "--results-directory", "TestResults",
                "--logger:console;verbosity=diag",
                "--logger:trx"
            )

            $runsettings = $(gi .\tests\$tst\$tfm\*.runsettings)
            if ($runsettings) {
                $argl += "--settings:$runsettings"
            }

            if ($qry -ne "" -and $qry -ne $null) {
                $argl += @("--filter", $qry)
                Add-Content $env:GITHUB_ENV "`nRET=TestResults--$tst-$qry--$tfm--$sys"
            } else {
                Add-Content $env:GITHUB_ENV "`nRET=TestResults--$tst--$tfm--$sys"
            }

            dotnet test @argl $tests[0].FullName
        }
    - name: Archive Test Results
      if: always() && startsWith(env.RET, 'TestResults--')
      run: tar czvf TestResults.tar.gz TestResults
    - name: Upload Test Results
      if: always() && startsWith(env.RET, 'TestResults--')
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.RET }}
        path: TestResults.tar.gz
  release:
    name: Release
    if: github.event_name != 'pull_request'
    needs:
    - test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      # One switch for the GitHub release and the nuget.org push together, so neither happens without the
      # other. Nothing reaches nuget.org implicitly: either a tag drives the build, or the run was asked
      # for it by hand. The GitHub Packages push below is not gated by this and still runs on every build.
      PUBLISH: ${{ github.ref_type == 'tag' || inputs.publish == true }}
    steps:
    - name: Checkout Source
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Setup .NET 8.0
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.0.x
    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v4
      with:
        versionSpec: 6.x
    - name: Execute GitVersion
      id: GitVersion
      uses: gittools/actions/gitversion/execute@v4
      with:
        useConfigFile: true
    - name: Download NuGet Packages
      uses: actions/download-artifact@v8
      with:
        name: nuget
        path: dist/nuget
    # `commit` is what lets this run from a branch: with no tag of this name yet the action creates one
    # there, so the tag is a product of the build rather than something to remember to make, and to keep
    # in order. Where the tag does already exist and carries a release -- an explicit tag build, or a
    # re-run -- allowUpdates keeps that from failing and updates it in place instead,
    # omitBodyDuringUpdate leaves notes written by hand alone, and replacesArtifacts refreshes the
    # packages rather than colliding with the ones already attached.
    - name: Create Release
      if: env.PUBLISH == 'true'
      uses: ncipollo/release-action@v1
      with:
        tag: ${{ steps.GitVersion.outputs.semVer }}
        commit: ${{ github.sha }}
        allowUpdates: true
        omitBodyDuringUpdate: true
        replacesArtifacts: true
        artifacts: dist/nuget/*.nupkg,dist/nuget/*.snupkg
        prerelease: ${{ contains(steps.GitVersion.outputs.semVer, '-') }}
        makeLatest: ${{ !contains(steps.GitVersion.outputs.semVer, '-') }}
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: Push NuGet (GitHub)
      shell: pwsh
      run: dotnet nuget push dist/nuget/*.nupkg --source $env:GITHUB_REPOS --api-key $env:GITHUB_TOKEN --skip-duplicate
      env:
        GITHUB_REPOS: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Push NuGet
      if: env.PUBLISH == 'true'
      shell: pwsh
      run: dotnet nuget push dist/nuget/*.nupkg --source $env:NUGET_REPOS --api-key $env:NUGET_TOKEN --skip-duplicate
      env:
        NUGET_REPOS: https://api.nuget.org/v3/index.json
        NUGET_TOKEN: ${{ secrets.NUGET_TOKEN }}
